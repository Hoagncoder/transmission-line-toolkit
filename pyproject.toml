[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transmission-line-toolkit"
version = "0.1.0"
description = "Transmission-line analysis and impedance matching (quarter-wave, L-network, single stub) with a command-line interface."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hoagncoder" }]
keywords = ["transmission line", "impedance matching", "VSWR", "stub", "RF", "microwave"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
web = ["streamlit>=1.35", "plotly>=5.18"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.5", "streamlit>=1.35", "plotly>=5.18"]

[project.scripts]
tlmatch = "tltoolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
